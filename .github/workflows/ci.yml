name: Verify

on:
  push:
    branches: [main, development, 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'refactor/**', 'perf/**', 'test/**', 'ci/**']
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      HUSKY: '0'
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/jobscout_ci
      REDIS_URL: redis://127.0.0.1:6379
      AI_ALLOW_MOCKS: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-commits.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run docs:check
      - run: npm run scan:secrets
      - run: npm audit --omit=dev --audit-level=high || echo 'AUDIT REPORT UNAVAILABLE; review required before release.'
      - run: redis-cli -h 127.0.0.1 config set maxmemory-policy noeviction
      - run: npm run openapi
      - run: git diff --exit-code -- docs/openapi.json openapi.json

  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build --tag jobscout-api:ci --file Dockerfile .

  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          HUSKY: '0'
          NEXT_TELEMETRY_DISABLED: '1'
