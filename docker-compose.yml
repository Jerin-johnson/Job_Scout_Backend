services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: jobscout-api
    restart: unless-stopped
    ports:
      - "${PORT:-4001}:4001"
    environment:
      - NODE_ENV=development
      - PORT=4001
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongo:27017/jobscout
      - REDIS_URL=redis://redis:6379
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "src/server.js"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: jobscout-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/jobscout
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "src/worker.js"]

  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: jobscout-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=jobscout
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: jobscout-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongo_data:
  redis_data:
